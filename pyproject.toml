[project]
name = "hightrader"
version = "0.1.0"
description = "Automated prop-firm evaluation trading system: backtesting, firm rule simulation, Monte Carlo pass-probability optimization, and live risk governance."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
data = ["yfinance>=0.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
